syntax = "proto3";

package market;

service MarketService {
    rpc GetContentRegistration (GetContentRegistrationRequest) returns (GetContentRegistrationResponse);
    rpc CompleteContentRegistration(CompleteContentRegistrationRequest) returns (CompleteContentRegistrationResponse);
}

message GetContentRegistrationRequest {
    int32 registration_id = 1;
    string job_id = 2;
}

message GetContentRegistrationResponse {
    int32 registration_id = 1;
    string original_text = 2;
    int32 price = 3;
    int32 author_id = 4;
}

message CompleteContentRegistrationRequest {
    string job_id = 1;
    int32 registration_id = 2;

  // ----------------------------------------------------------
  // 암호화된 소설 데이터
  // ----------------------------------------------------------
    string encrypted_data = 3;
    string iv = 4;
    string auth_tag = 5;

  // ----------------------------------------------------------
  // Data Key
  // ----------------------------------------------------------

  // AES Data Key를 MASTER_KEY로 암호화한 값
    string encrypted_data_key = 6;
    int32 encryption_version = 7;

  // ----------------------------------------------------------
  // Content 검증
  // ----------------------------------------------------------

  // 원문 SHA-256 hash
  // HEX 64자
    string content_hash = 8;

  // ----------------------------------------------------------
  // Blockchain 결과
  // ----------------------------------------------------------

  // 블록체인 트랜잭션 hash
    string tx_hash = 9;
}

message CompleteContentRegistrationResponse {
    bool success = 1;
    string message = 2;
}